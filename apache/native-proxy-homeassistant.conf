# native-proxy-homeassistant.conf
# ─────────────────────────────────────────────────────────────────────────────
# Native Apache reverse-proxy config for Home Assistant on latitude.
#
# Home Assistant runs at http://localhost:8123.
# This vhost provides HTTPS termination and WebSocket support.
#
# Installation on latitude (one-time):
#   1. Issue cert (pre/post hooks stop/start Apache automatically):
#        sudo certbot certonly --standalone -d homeassistant.mxtracks.info
#
#   2. Enable required Apache modules (if not already active):
#        sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#
#   3. Install this config:
#        sudo cp ~/git/dockerApache/apache/native-proxy-homeassistant.conf \
#                 /etc/apache2/sites-available/homeassistant.mxtracks.info.conf
#        sudo a2ensite homeassistant.mxtracks.info.conf
#        sudo apache2ctl configtest && sudo systemctl reload apache2
#
#   4. Tell Home Assistant to trust the proxy – add to /config/configuration.yaml:
#        http:
#          use_x_forwarded_for: true
#          trusted_proxies:
#            - 127.0.0.1
#            - ::1
#      Then restart HA: Settings → System → Restart
#
# Cert renewal is handled automatically by certbot's pre/post hooks
# (/etc/letsencrypt/renewal-hooks/pre/stop-apache.sh  → systemctl stop apache2)
# (/etc/letsencrypt/renewal-hooks/post/start-apache.sh → systemctl start apache2)
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName homeassistant.mxtracks.info
    RewriteEngine On
    RewriteRule ^(.*)$ https://homeassistant.mxtracks.info$1 [R=301,L]
</VirtualHost>

# ── HTTPS reverse proxy ──────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName homeassistant.mxtracks.info

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/homeassistant.mxtracks.info/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/homeassistant.mxtracks.info/privkey.pem

    # ── WebSocket support (Home Assistant uses WS for real-time updates) ─────
    # RewriteRule handles both WS upgrades and normal HTTP in one block.
    # ProxyPass / ProxyPassReverse handle the non-WS fallback path.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:8123/$1 [P,L]

    # ── Standard HTTP proxy (non-WebSocket) ──────────────────────────────────
    ProxyPreserveHost On
    ProxyRequests     Off
    ProxyPass        / http://127.0.0.1:8123/
    ProxyPassReverse / http://127.0.0.1:8123/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # ── Security headers ─────────────────────────────────────────────────────
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog  /var/log/apache2/homeassistant.mxtracks.info-error.log
    CustomLog /var/log/apache2/homeassistant.mxtracks.info-access.log combined
</VirtualHost>

