# native-proxy-mirror.conf
# ─────────────────────────────────────────────────────────────────────────────
# Native macOS Apache reverse-proxy config for the mirror domains on mac2016.
# Place this file in your Apache vhosts/extra directory, e.g.:
#   Homebrew Apache : /usr/local/etc/httpd/extra/
#   macOS built-in  : /etc/apache2/extra/
# Then include it from httpd.conf:
#   Include /usr/local/etc/httpd/extra/native-proxy-mirror.conf
#
# Cert paths written by deploy-certs-to-mirror.sh → ~/ssl/<domain>-*.pem
# ─────────────────────────────────────────────────────────────────────────────

# ── SSL global config (replaces httpd-ssl.conf which we don't include) ───────
Listen 443
SSLCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES
SSLProxyCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES
SSLHonorCipherOrder on
SSLProtocol all -SSLv3
SSLProxyProtocol all -SSLv3
SSLPassPhraseDialog  builtin
SSLSessionCache "shmcb:/private/var/run/ssl_scache(512000)"
SSLSessionCacheTimeout 300

# ── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName dev16.mxtracks.info
    RewriteEngine On
    RewriteRule ^(.*)$ https://dev16.mxtracks.info$1 [R=301,L]
</VirtualHost>

<VirtualHost *:80>
    ServerName www16.mxtracks.info
    RewriteEngine On
    RewriteRule ^(.*)$ https://www16.mxtracks.info$1 [R=301,L]
</VirtualHost>

# ── dev16.mxtracks.info ──────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName dev16.mxtracks.info

    SSLEngine on
    SSLCertificateFile    /Users/hannes/ssl/dev16.mxtracks.info-fullchain.pem
    SSLCertificateKeyFile /Users/hannes/ssl/dev16.mxtracks.info-privkey.pem
    # (Apache 2.4.8+ uses fullchain for both cert+chain; no SSLCertificateChainFile needed)

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Tell WordPress it arrived over HTTPS (wp-config.php already patched by sync)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ErrorLog  /var/log/apache2/dev16.mxtracks.info-error.log
    CustomLog /var/log/apache2/dev16.mxtracks.info-access.log combined
</VirtualHost>

# ── www16.mxtracks.info ──────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName www16.mxtracks.info

    SSLEngine on
    SSLCertificateFile    /Users/hannes/ssl/www16.mxtracks.info-fullchain.pem
    SSLCertificateKeyFile /Users/hannes/ssl/www16.mxtracks.info-privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ErrorLog  /var/log/apache2/www16.mxtracks.info-error.log
    CustomLog /var/log/apache2/www16.mxtracks.info-access.log combined
</VirtualHost>

