<VirtualHost *:80>
    ServerName www16.mxtracks.info
    ServerAlias www.mxtracks.info
    DocumentRoot /var/www/html/mxdocs
    DirectoryIndex index.php index.html

    <Directory /var/www/html/mxdocs>
        Options Indexes SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    Include /etc/apache2/sites-enabled/www16-owncloud.inc
    Include /etc/apache2/sites-enabled/www16-github.inc

    ErrorLog  /var/log/apache2/www16.mxtracks.info-error.log
    CustomLog /var/log/apache2/www16.mxtracks.info-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName www16.mxtracks.info
    ServerAlias www.mxtracks.info
    DocumentRoot /var/www/html/mxdocs
    DirectoryIndex index.php index.html

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/www16.mxtracks.info-fullchain.pem
    SSLCertificateKeyFile /etc/apache2/certs/www16.mxtracks.info-privkey.pem

    <Directory /var/www/html/mxdocs>
        Options Indexes SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    Include /etc/apache2/sites-enabled/www16-mxserver.inc
    Include /etc/apache2/sites-enabled/www16-owncloud.inc
    Include /etc/apache2/sites-enabled/www16-github.inc

    ErrorLog  /var/log/apache2/www16.mxtracks.info-ssl-error.log
    CustomLog /var/log/apache2/www16.mxtracks.info-ssl-access.log combined
</VirtualHost>
