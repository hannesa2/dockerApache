services:
  db:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL administrator password}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "${POSTGRES_LAN_IP:?Set the LAN IPv4 address}:${POSTGRES_PORT:-5432}:5432"
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${CAMERA_POSTGRES_DATA_DIR:?Set the PostgreSQL data directory}:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/camera-pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/camera-pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
