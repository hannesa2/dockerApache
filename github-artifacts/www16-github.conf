RedirectMatch 301 ^/github$ /github/
ProxyPreserveHost On

<LocationMatch "^/github(?:/|$)">
    RequestHeader set X-Forwarded-Prefix "/github"
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    Header edit Location "^/$" "/github/"
</LocationMatch>

ProxyPass        /github/ http://github-artifacts:5000/
ProxyPassReverse /github/ http://github-artifacts:5000/
