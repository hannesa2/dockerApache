<VirtualHost *:443>
    ServerName git16.mxtracks.info

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/git16.mxtracks.info-fullchain.pem
    SSLCertificateKeyFile /etc/apache2/certs/git16.mxtracks.info-privkey.pem

    ProxyPreserveHost On
    RequestHeader set Host "git16.mxtracks.info:9443"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "9443"
    RequestHeader set X-Forwarded-Ssl "on"
    ProxyPass / http://gitlab:80/ upgrade=websocket
    ProxyPassReverse / http://gitlab:80/

    ErrorLog  /var/log/apache2/git16-proxy-ssl-error.log
    CustomLog /var/log/apache2/git16-proxy-ssl-access.log combined
</VirtualHost>
