<VirtualHost *:80>
    ServerName git16.mxtracks.info
    DocumentRoot /srv/www/vhosts/git.mx

    Alias /.well-known/acme-challenge/ \
        /srv/www/vhosts/git.mx/.well-known/acme-challenge/

    <Directory /srv/www/vhosts/git.mx/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <Location />
        Require all denied
    </Location>

    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>

    ErrorLog /var/log/apache2/git16-acme-error.log
    CustomLog /var/log/apache2/git16-acme-access.log combined
</VirtualHost>
