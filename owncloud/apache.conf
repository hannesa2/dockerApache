<VirtualHost *:8080>
    ServerName www16.mxtracks.info
    DocumentRoot /var/www
    DirectoryIndex index.php index.html

    <Directory /var/www>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/owncloud>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
