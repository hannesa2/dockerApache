name: owncloud-upgrade-test

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: "no"
    logging: *logging
    environment:
      POSTGRES_DB: owncloud_stage
      POSTGRES_USER: owncloud_stage
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Generated by prepare-upgrade-test.sh}
    volumes:
      - ${TEST_STATE_ROOT:?Generated by prepare-upgrade-test.sh}/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owncloud_stage -d owncloud_stage"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - isolated

  redis:
    image: redis:7-alpine
    restart: "no"
    logging: *logging
    volumes:
      - ${TEST_STATE_ROOT:?Generated by prepare-upgrade-test.sh}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks:
      - isolated

  owncloud:
    image: owncloud/server:11.1.0
    restart: "no"
    stop_grace_period: 60s
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OWNCLOUD_DOMAIN: localhost:8094
      OWNCLOUD_TRUSTED_DOMAINS: localhost:8094,localhost,127.0.0.1
      OWNCLOUD_DB_TYPE: pgsql
      OWNCLOUD_DB_NAME: owncloud_stage
      OWNCLOUD_DB_USERNAME: owncloud_stage
      OWNCLOUD_DB_PASSWORD: ${TEST_DB_PASSWORD:?Generated by prepare-upgrade-test.sh}
      OWNCLOUD_DB_HOST: db
      OWNCLOUD_DB_PREFIX: oc_
      OWNCLOUD_REDIS_ENABLED: "true"
      OWNCLOUD_REDIS_HOST: redis
      OWNCLOUD_CROND_ENABLED: "false"
      OWNCLOUD_APPS_DISABLE: onlyoffice
    volumes:
      - ${TEST_STATE_ROOT:?Generated by prepare-upgrade-test.sh}/runtime:/mnt/data
      - ${TEST_STATE_ROOT:?Generated by prepare-upgrade-test.sh}/config:/mnt/data/config
      - ${TEST_STATE_ROOT:?Generated by prepare-upgrade-test.sh}/apps:/mnt/data/apps
      - ${TEST_FILES:?Generated by prepare-upgrade-test.sh}:/mnt/data/files
    networks:
      - isolated

networks:
  isolated:
    internal: true
